# Development-only PostgreSQL container.
#
# Client runtime (WPF POS, branch node) never touches Docker or this compose
# file (design.md: "clients require no Docker"). This exists purely so
# developers/CI can validate the real RLS policies in ./db/init-rls.sql
# against a live PostgreSQL instance, and to run `PostgresCloudInboxStore`
# (real Npgsql adapter) plus the transaction-pooler proof-of-concept against
# a realistic local approximation of Supabase's Supavisor transaction-mode
# pooler (Unit 2's non-negotiable PoC task — see deploy/README.md for the
# recorded pass/fail outcome).
#
# `name:` is explicit because this file lives at deploy/dev/, not the repo
# root -- without it, Compose derives the project name from the containing
# directory ("dev"), producing uninformative container names like
# "dev-postgres-1" that say nothing about which project they belong to.
name: incoders-commerce
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: commerce_dev
      POSTGRES_USER: commerce_owner
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "5432:5432"
    volumes:
      - ./db/init-rls.sql:/docker-entrypoint-initdb.d/init-rls.sql:ro
      # Creates `commerce_test` and applies the SAME init-rls.sql to it. The
      # integration suite truncates `users`/`branches`/`organizations` in
      # dozens of fixtures, so it must never share a database with the app a
      # developer is actually signed in to (PostgresTestFixture.Database).
      # Ordering matters and is alphabetical: init-rls.sql initializes
      # commerce_dev (and the cluster-wide roles) first, then init-test-db.sql
      # reuses them for commerce_test.
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
      # Without this, the data directory lives in the container's writable
      # layer and `docker compose down` — or any recreate — silently destroys
      # the developer's signed-in accounts along with it. The init scripts
      # above only run when this volume is empty, so a normal stop/start
      # keeps everything; `down -v` is the deliberate way to start clean.
      - postgres-data:/var/lib/postgresql/data
    # The integration test suite spins up a short-lived WebApplicationFactory
    # (and its own Npgsql connection pool) per test method rather than
    # sharing one pool across the run. Pool teardown isn't instantaneous at
    # the socket level, so hundreds of these in quick succession can briefly
    # overshoot Postgres 16's default max_connections=100 before the backlog
    # drains, producing SqlState 53300 ("remaining connection slots are
    # reserved for roles with the SUPERUSER attribute"). Dev/CI-only
    # workaround for that overshoot — not a production concern, since Railway
    # sits behind PgBouncer with far fewer, longer-lived connections.
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_owner -d commerce_dev"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Local approximation of Supabase's Supavisor transaction-mode pooler
  # (port 6543). Real Supabase project provisioning is a manual, out-of-repo
  # step (deploy/README.md); PgBouncer in `pool_mode = transaction` is the
  # closest realistic local stand-in for proving `set_config(..., true)`
  # tenant scoping cannot leak across pooled connections.
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      # NO DATABASES_DBNAME here, and that is deliberate too. The image's
      # entrypoint emits one wildcard `[databases]` entry; setting
      # DATABASES_DBNAME appends `dbname=...` to it, which REWRITES every
      # client's requested database to that one name. Pinned to `commerce_dev`,
      # a pooled test connection asking for `commerce_test` was silently
      # answered by `commerce_dev` — the integration suite would have kept
      # truncating the developer's accounts through port 6543 even after the
      # direct connections moved off it. Omitting it leaves the wildcard as
      # `* = host=postgres port=5432`, which passes the client-requested
      # database straight through, so 6543 now serves BOTH `commerce_dev` (the
      # app) and `commerce_test` (PoolerScopingTests) from one pooler. This
      # also matches Supavisor, which routes by the requested database rather
      # than forcing one.
      # NO fixed DATABASES_USER/PASSWORD here: this is deliberate. With no
      # `user=` clause, PgBouncer passes each client's OWN authenticated
      # username through to the Postgres backend, matching Supabase's real
      # Supavisor per-role connection shape. A first PoC revision hardcoded
      # `commerce_owner` here, which meant EVERY client — regardless of which
      # role it claimed — ran queries as the superuser table owner, silently
      # bypassing RLS entirely and producing a false "leak" (every org saw
      # every other org's rows). That bug is exactly what this PoC exists to
      # catch, and it is why the fix (per-role pass-through + userlist.txt)
      # is documented here instead of only in a commit message.
      PGBOUNCER_LISTEN_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_AUTH_TYPE: plain
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
    volumes:
      - ./pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6543:6432"

  # Unit 5: containerized Cloud.Api (with the SPA it embeds in wwwroot),
  # built from the SAME repo-root Dockerfile Railway deploys (Unit 2). Behind
  # a profile so the default `docker compose up` (no --profile) stays
  # Postgres+PgBouncer-only for the fast `dotnet run` inner loop — this
  # service is strictly additive.
  #
  # `docker compose -f deploy/dev/compose.yaml --profile full up` gives a
  # complete local stack (Cloud.Api + SPA + Postgres + pooler) with zero
  # `dotnet run` / `npm run dev` needed.
  cloud-api:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Direct (non-pooled) local Postgres connection — matches
      # appsettings.Development.json's shape. The transaction pooler
      # (pgbouncer, above) is exercised by PoolerScopingTests, not by this
      # everyday local-stack profile.
      ConnectionStrings__Commerce: "Host=postgres;Port=5432;Database=commerce_dev;Username=app_runtime;Password=dev-only-password"
      ConnectionStrings__CommercePlatformRead: "Host=postgres;Port=5432;Database=commerce_dev;Username=platform_readonly;Password=dev-only-platform-readonly-password"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
